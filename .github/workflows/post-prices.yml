name: Post Gold/Currency Prices to Telegram

on:
  schedule:
    # هر ۵ دقیقه یک‌بار اجرا می‌شود.
    # توجه: GitHub Actions تضمین دقیق ۵ دقیقه بودن را نمی‌دهد؛
    # در ساعات شلوغ ممکن است چند دقیقه تأخیر داشته باشد.
    - cron: "*/5 * * * *"
  # اجازه‌ی اجرای دستی از تب Actions در گیت‌هاب (برای تست)
  workflow_dispatch: {}

# جلوگیری از اجرای هم‌زمان چند نسخه (اگر اجرای قبلی هنوز تمام نشده)
concurrency:
  group: post-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post prices to Telegram channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 post_once.py
